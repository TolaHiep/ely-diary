<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Săn Sale - Deal Mới Nhất</title>
    <style>
        :root { --primary: #ee4d2d; --dark: #333; --light: #f5f5f5; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: var(--light); color: var(--dark); }
        header { background-color: white; padding: 20px; text-align: center; border-bottom: 2px solid var(--primary); }
        header h1 { margin: 0; color: var(--primary); font-size: 1.8rem; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .deal-card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 20px; display: flex; gap: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); align-items: center; }
        .deal-image { width: 120px; height: 120px; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #eee; }
        .deal-image img { width: 100%; height: 100%; object-fit: cover; }
        .deal-info { flex: 1; }
        .deal-title { margin: 0 0 10px; font-size: 1.1rem; font-weight: 600; line-height: 1.3; }
        .deal-price { color: var(--primary); font-weight: bold; font-size: 1.2rem; }
        .deal-old-price { text-decoration: line-through; color: #999; font-size: 0.9rem; margin-left: 10px; }
        .btn-buy { display: inline-block; background: var(--primary); color: white; padding: 10px 20px; border-radius: 4px; text-decoration: none; font-weight: bold; margin-top: 10px; }
        .tag { background: #ffe8e4; color: var(--primary); padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>
    <header>
        <h1>🔥 Trạm Săn Sale</h1>
        <p>Tổng hợp Deal Gia Dụng & Công Nghệ Giảm Sâu Nhất</p>
    </header>
    <div class="container">
        
        <div class="deal-card">
            <div class="deal-image">
                <img src="https://down-vn.img.susercontent.com/file/vn-11134207-7r98o-lsth6k6d9a04a6" alt="Robot Hút Bụi Lau Nhà">
            </div>
            <div class="deal-info">
                <div class="tag">Gia Dụng Thông Minh</div>
                <h3 class="deal-title">Robot Hút Bụi Lau Nhà [GIÁ - cần kiểm tra]</h3>
                <div class="deal-price">Đang cập nhật <span class="deal-old-price"></span></div>
                <p style="margin:5px 0 0; color:#666; font-size:0.9rem;">Tự động làm sạch, tiết kiệm thời gian. (Thông tin đang chờ xác minh)</p>
                <a href="https://shopee.vn" class="btn-buy" target="_blank">Xem ngay</a>
            </div>
        </div>
        
    </div>
</body>
</html>
