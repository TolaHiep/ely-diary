<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Săn Sale - Deal Hot Mỗi Ngày</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f5f5; color: #333; }
        header { background: #ee4d2d; color: white; padding: 20px; text-align: center; }
        header h1 { font-size: 2rem; margin-bottom: 5px; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .card-img { width: 100%; height: 280px; object-fit: cover; }
        .card-body { padding: 15px; }
        .title { font-size: 1.1rem; margin-bottom: 10px; color: #333; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
        .price { color: #ee4d2d; font-size: 1.4rem; font-weight: bold; }
        .original-price { color: #999; text-decoration: line-through; font-size: 0.9rem; }
        .discount { background: #fff0f1; color: #ee4d2d; padding: 2px 5px; font-size: 0.8rem; border: 1px solid #ee4d2d; border-radius: 3px; }
        .features { font-size: 0.9rem; color: #666; margin-bottom: 15px; list-style-position: inside; }
        .btn-buy { display: block; width: 100%; background: #ee4d2d; color: white; text-align: center; padding: 10px; text-decoration: none; font-weight: bold; border-radius: 4px; transition: background 0.2s; }
        .btn-buy:hover { background: #d73a1c; }
        footer { text-align: center; padding: 20px; color: #777; margin-top: 40px; border-top: 1px solid #ddd; }
    </style>
</head>
<body>
    <header>
        <h1>🔥 Trạm Săn Sale 🔥</h1>
        <p>Tổng hợp Deal cực hời, Voucher giảm giá sâu nhất hôm nay</p>
    </header>
    <div class="container">
        <div class="grid">

            <div class="card">
                <img src="https://down-vn.img.susercontent.com/file/vn-11134207-7qukw-ligs80t9l35v45" alt="Robot Hút Bụi Lau Nhà Xiaomi Mi Robot Vacuum Mop 2 Pro" class="card-img">
                <div class="card-body">
                    <h3 class="title">Robot Hút Bụi Lau Nhà Xiaomi Mi Robot Vacuum Mop 2 Pro</h3>
                    <div class="price-row">
                        <span class="price">4.990.000đ</span>
                        <span class="original-price">7.990.000đ</span>
                        <span class="discount">-38%</span>
                    </div>
                    <a href="https://shopee.vn/Robot-hút-bụi-lau-nhà-Xiaomi-Vacuum-Mop-2-Pro-Bản-Quốc-Tế-Bảo-Hành-Chính-Hãng-12-Tháng-i.18485292.11586523956" target="_blank" class="btn-buy">XEM DEAL TRÊN SHOPEE</a>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <p>Cập nhật liên tục. Hãy lưu lại trang này để không bỏ lỡ deal hời nhé!</p>
    </footer>
</body>
</html>
